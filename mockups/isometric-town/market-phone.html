<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lythmere Market</title>
<style>
  html,body{margin:0;height:100%;background:#1c1612;overflow:hidden}
  #visualShell{
    position:relative;width:100%;height:100dvh;height:100vh;overflow:hidden;background:#2a241e;
  }
  .townScene{
    position:absolute;inset:0;
    background:#2a241e url("./lythmere-market-scene.jpg") center / cover no-repeat;
  }
  .worldTopbar{
    position:absolute;z-index:40;left:0;right:0;top:0;
    display:flex;flex-direction:row;flex-wrap:nowrap;
    align-items:flex-start;justify-content:space-between;gap:10px;
    padding:max(16px, env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px) + 10px) 0 max(16px, env(safe-area-inset-left, 0px) + 10px);
    box-sizing:border-box;pointer-events:none;background:transparent;border:0;
  }
  .worldTopbar #advanceTime,.worldTopbar .worldActions{pointer-events:auto}
  .worldActions{flex:0 0 auto;display:flex}
  .paperPlaque{
    position:relative;
    display:flex;flex-direction:row;flex-wrap:nowrap;align-items:stretch;
    height:48px;min-height:48px;padding:0;margin:0;border:1px solid #c4a06a;border-radius:2px;
    background:linear-gradient(180deg,#f7ead2 0%,#edd6aa 100%);
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));
    overflow:visible;box-sizing:border-box;
  }
  .paperCorners{position:absolute;inset:0;z-index:5;pointer-events:none}
  .paperCorner{
    position:absolute;width:16px;height:19px;object-fit:contain;pointer-events:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }
  .paperCorner-tl{top:-4px;left:-4px}
  .paperCorner-tr{top:-4px;right:-4px;transform:scaleX(-1)}
  .paperCorner-bl{bottom:-4px;left:-4px;transform:scaleY(-1)}
  .paperCorner-br{bottom:-4px;right:-4px;transform:scale(-1)}
  .scrollWell{
    flex:1 1 auto;min-width:0;position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin:0;padding:4px 16px;border:0;background:none;
  }
  #advanceTime.paperPlaque{
    flex:1 1 auto;width:auto;min-width:0;max-width:min(224px, calc(100% - 110px));
    height:48px;min-height:48px;
  }
  .scrollCopy{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;overflow:hidden}
  #visualDate{
    font:700 12px/1.1 Georgia,serif;color:#1a120c;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #visualPhase{
    font:500 10px/1.1 Georgia,serif;color:#614a34;margin-top:1px;letter-spacing:.08em;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #worldRecord.paperPlaque{
    height:42px;min-height:42px;min-width:108px;padding:0;gap:0;
    font:800 11px/1 Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:#1a120c;
  }
  #worldRecord .scrollWell{padding:4px 12px 4px 14px}
  .locationStrip.paperPlaque{
    position:absolute;z-index:32;left:50%;right:auto;
    bottom:max(10px, env(safe-area-inset-bottom, 0px));
    width:min(620px, calc(100% - 24px));height:48px;min-height:48px;
    transform:translateX(-50%);
  }
  .locationStrip .scrollWell{padding:4px 12px 4px 28px}
  .paperSeal-left{
    position:absolute;left:-6px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;object-fit:contain;z-index:6;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));pointer-events:none;
  }
  .locationWell{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;height:100%;padding:0;gap:0;
  }
  .locationWell button{
    position:relative;min-height:0;height:100%;margin:0;padding:8px 4px;
    background:transparent;color:#3d2b1a;border:0;border-right:1px solid rgba(90,62,38,.22);
    border-radius:0;font:700 9px/1.05 Georgia,serif;letter-spacing:.04em;text-transform:uppercase;
    text-shadow:0 1px 0 rgba(255,244,214,.7);
  }
  .locationWell button:last-child{border-right:0}
  .locationWell button.active{color:#1a120c;font-weight:800}
</style>
</head>
<body>
<section id="visualShell">
  <div class="townScene" data-location="Market"></div>
  <div class="worldTopbar">
    <button type="button" id="advanceTime" class="paperPlaque" aria-label="Pass time">
      <span class="paperCorners" aria-hidden="true">
        <img class="paperCorner paperCorner-tl" src="./paper_corner.png" alt="">
        <img class="paperCorner paperCorner-tr" src="./paper_corner.png" alt="">
        <img class="paperCorner paperCorner-bl" src="./paper_corner.png" alt="">
        <img class="paperCorner paperCorner-br" src="./paper_corner.png" alt="">
      </span>
      <span class="scrollWell">
        <span class="scrollCopy">
          <b id="visualDate">Monday, 2 March · Year 1</b>
          <span id="visualPhase">Morning</span>
        </span>
      </span>
    </button>
    <div class="worldActions">
      <button id="worldRecord" class="paperPlaque" type="button">
        <span class="paperCorners" aria-hidden="true">
          <img class="paperCorner paperCorner-tl" src="./paper_corner.png" alt="">
          <img class="paperCorner paperCorner-tr" src="./paper_corner.png" alt="">
          <img class="paperCorner paperCorner-bl" src="./paper_corner.png" alt="">
          <img class="paperCorner paperCorner-br" src="./paper_corner.png" alt="">
        </span>
        <span class="scrollWell"><span>Journal</span></span>
      </button>
    </div>
  </div>
  <nav class="locationStrip paperPlaque" aria-label="Lythmere locations">
    <span class="paperCorners" aria-hidden="true">
      <img class="paperCorner paperCorner-tl" src="./paper_corner.png" alt="">
      <img class="paperCorner paperCorner-tr" src="./paper_corner.png" alt="">
      <img class="paperCorner paperCorner-bl" src="./paper_corner.png" alt="">
      <img class="paperCorner paperCorner-br" src="./paper_corner.png" alt="">
    </span>
    <img class="paperSeal-left" src="./paper_seal.png" alt="">
    <div class="scrollWell locationWell">
      <button type="button" class="active">Market</button>
      <button type="button">Riverside</button>
      <button type="button">Inn</button>
      <button type="button">Club</button>
    </div>
  </nav>
</section>
</body>
</html>
