<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Road — 120 faces</title>
<style>
:root{--ink:#2a1c12;--paper:#f4ead3;--rule:#c6a15a;--chip:#efe2c4}
*{box-sizing:border-box}
html,body{margin:0;background:#1c1713;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
header{
  position:sticky;top:0;z-index:8;
  background:rgba(244,234,211,.96);
  border-bottom:2px solid #594333;
  padding:12px 16px 14px;
  box-shadow:0 8px 24px #0006;
}
h1{margin:0;font-size:22px}
.sub{margin:4px 0 10px;font-size:13px;color:#614a34}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{
  flex:1 1 180px;min-width:0;max-width:280px;
  padding:8px 10px;border:1px solid #8a6a45;border-radius:6px;
  background:#fffaf0;font:16px Georgia,serif;color:var(--ink)
}
.chip, .toggle{
  border:1px solid #8a6a45;background:var(--chip);color:var(--ink);
  border-radius:999px;padding:6px 11px;font:700 12px Georgia,serif;cursor:pointer
}
.chip.on,.toggle.on{background:#3d2a1a;color:#f4ead3;border-color:#3d2a1a}
main{padding:16px;max-width:1400px;margin:0 auto}
section h2{margin:18px 0 10px;font-size:18px;color:#f4ead3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{cursor:pointer;text-align:center;color:#f4ead3}
.tile .card{
  position:relative;aspect-ratio:5/7;width:100%;
  background:#e8d7b0 url("../assets/ui/card_gilt_frame.png") center/100% 100% no-repeat;
  border-radius:8px;overflow:hidden;box-shadow:0 6px 16px #0008
}
.tile.paint .card{background:#cbb892;border-radius:4px}
.giltWindow{position:absolute;inset:12.43% 18.65% 12.43% 18.55%;background-size:cover;background-position:center}
.tile.paint .giltWindow{inset:0}
.n,.e,.s,.w{
  position:absolute;z-index:3;font-weight:800;color:#2a1c12;
  text-shadow:0 1px 0 rgba(255,244,214,.75);font-size:clamp(11px,2.4vw,16px);line-height:.95
}
.n{top:9.7%;left:50%;transform:translateX(-50%)}
.s{bottom:9.3%;left:50%;transform:translateX(-50%)}
.w{left:14.5%;top:50%;transform:translateY(-50%)}
.e{right:14.6%;top:50%;transform:translateY(-50%)}
.tile.paint .n,.tile.paint .e,.tile.paint .s,.tile.paint .w{display:none}
.cap{margin:8px 0 0;font-size:12px;line-height:1.3}
.cap b{display:block;font-size:13px}
.tile.hidden{display:none}
#lightbox{
  display:none;position:fixed;inset:0;z-index:20;background:rgba(12,9,7,.88);
  padding:max(16px,env(safe-area-inset-top)) 16px;overflow:auto
}
#lightbox.on{display:flex;flex-direction:column;align-items:center}
#lightbox .card{width:min(72vw,380px);aspect-ratio:5/7;position:relative;
  background:#e8d7b0 url("../assets/ui/card_gilt_frame.png") center/100% 100% no-repeat;border-radius:10px}
#lightbox.paint .card{background:#cbb892}
#lightbox .giltWindow{position:absolute;inset:12.43% 18.65% 12.43% 18.55%;background-size:cover;background-position:center}
#lightbox.paint .giltWindow{inset:0}
#lightbox .n,#lightbox .e,#lightbox .s,#lightbox .w{
  position:absolute;z-index:3;font-weight:800;color:#2a1c12;
  text-shadow:0 1px 0 rgba(255,244,214,.75);font-size:clamp(18px,6vw,28px)
}
#lightbox.paint .n,#lightbox.paint .e,#lightbox.paint .s,#lightbox.paint .w{display:none}
#lightbox .meta{color:#f4ead3;text-align:center;margin:14px 0 8px;font-size:16px}
#lightbox button{margin:8px;padding:8px 14px;border-radius:8px;border:1px solid #c6a15a;background:#efe2c4;font:700 14px Georgia,serif}
</style>
</head>

<header>

</div>

const main = document.getElementById('main');
const byTier = {};
CARDS.forEach(c => { (byTier[c.tier] ||= []).push(c); });
['Common','Uncommon','Rare','High','Top'].forEach(tier => {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${tier} <small style="font-weight:400;opacity:.7">${byTier[tier].length}</small></h2>`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  byTier[tier].forEach(c => {
    const tile = document.createElement('article');
    tile.className = 'tile';
    tile.dataset.tier = c.tier;
    tile.dataset.q = (c.name + ' ' + c.display).toLowerCase();
    tile.dataset.id = c.name;
    tile.innerHTML = `<div class="card"><div class="giltWindow" style="background-image:url('../assets/cards/${c.name}.webp')"></div>
      <span class="n">${c.n}</span><span class="e">${c.e}</span><span class="s">${c.s}</span><span class="w">${c.w}</span></div>
      <p class="cap"><b>${c.display}</b>${c.name} · ${c.tier} · ${c.budget}</p>`;
    tile.addEventListener('click', () => openLb(c.name));
    grid.appendChild(tile);
  });
  sec.appendChild(grid);
  main.appendChild(sec);
});
let filter = 'all';
const tiles = [...document.querySelectorAll('.tile')];
function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  tiles.forEach(t => {
    const okTier = filter === 'all' || t.dataset.tier === filter;
    const okQ = !q || t.dataset.q.includes(q);
    t.classList.toggle('hidden', !(okTier && okQ));
  });
  document.querySelectorAll('section').forEach(sec => {
    sec.style.display = [...sec.querySelectorAll('.tile')].some(t => !t.classList.contains('hidden')) ? '' : 'none';
  });
}
document.getElementById('q').addEventListener('input', apply);
document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filter = btn.dataset.tier;
  apply();
}));
const paintBtn = document.getElementById('paint');
function setPaint(on){
  document.body.classList.toggle('paint', on);
  tiles.forEach(t => t.classList.toggle('paint', on));
  document.getElementById('lightbox').classList.toggle('paint', on);
  paintBtn.classList.toggle('on', on);
}
paintBtn.addEventListener('click', () => setPaint(!paintBtn.classList.contains('on')));
const lb = document.getElementById('lightbox');
let current = 0;
function openLb(id){
  current = CARDS.findIndex(c => c.name === id);
  showLb();
}
function showLb(){
  const c = CARDS[current];
  document.getElementById('lbArt').style.backgroundImage = `url('../assets/cards/${c.name}.webp')`;
  document.getElementById('lbN').textContent = c.n;
  document.getElementById('lbE').textContent = c.e;
  document.getElementById('lbS').textContent = c.s;
  document.getElementById('lbW').textContent = c.w;
  document.getElementById('lbMeta').textContent = `${c.name}  ${c.display}  ·  ${c.tier}  ·  ${c.n}/${c.e}/${c.s}/${c.w}  ·  ${c.budget}`;
  lb.classList.add('on');
}
document.getElementById('close').onclick = () => lb.classList.remove('on');
document.getElementById('prev').onclick = () => { current = (current + CARDS.length - 1) % CARDS.length; showLb(); };
document.getElementById('next').onclick = () => { current = (current + 1) % CARDS.length; showLb(); };
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('on'); });
</script>
