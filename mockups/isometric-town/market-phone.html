<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lythmere Market</title>
<style>
  html,body{margin:0;height:100%;background:#1c1612;overflow:hidden}
  #visualShell{
    position:relative;width:100%;height:100dvh;height:100vh;overflow:hidden;background:#2a241e;
  }
  .townScene{
    position:absolute;inset:0;
    background:#2a241e url("./lythmere-market-scene.jpg") center / cover no-repeat;
  }
  /* Reusable map HUD — the town-corners cutouts from commit 58325a8, not date_frame scrolls. */
  .hudDate,.hudJournal,.hudPlace{
    position:absolute;z-index:40;pointer-events:none;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
  }
  .hudDate{
    top:max(16px, env(safe-area-inset-top, 0px) + 10px);
    left:max(16px, env(safe-area-inset-left, 0px) + 10px);
    height:48px;width:auto;
  }
  .hudJournal{
    top:max(16px, env(safe-area-inset-top, 0px) + 10px);
    right:max(16px, env(safe-area-inset-right, 0px) + 10px);
    height:42px;width:auto;
  }
  .hudPlace{
    left:50%;bottom:max(16px, env(safe-area-inset-bottom, 0px) + 8px);
    transform:translateX(-50%);
    height:48px;width:min(366px, calc(100% - 24px));
    object-fit:fill;
  }
</style>
</head>
<body>
<section id="visualShell">
  <div class="townScene" data-location="Market"></div>
  <img class="hudDate" src="./hud/town-corners-date.png" alt="Mon 2 Mar, morning year 1">
  <img class="hudJournal" src="./hud/town-corners-journal.png" alt="Journal">
  <img class="hudPlace" src="./hud/town-corners-place.png" alt="Market, Riverside, Inn, Club">
</section>
</body>
</html>
