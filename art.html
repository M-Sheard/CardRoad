html,body{margin:0;background:#1c1713;color:#f4ead3;font-family:Georgia,serif}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

figcaption{margin:6px 2px 4px;font-size:12px;line-height:1.3}

  aspect-ratio:5/7;

  border:0;

.card.gilt .giltWindow{
  position:absolute;
  z-index:1;

  right:18.65%;

  bottom:12.43%;
  border:0;
  border-radius:1px;
  overflow:hidden
}
.card.gilt .giltWindow img{
  display:block;width:100%;height:100%;object-fit:cover
}
.card.gilt .n,
.card.gilt .e,
.card.gilt .s,
.card.gilt .w{
  position:absolute;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:.95;
  font-weight:800;
  color:#2a1c12;
  text-shadow:0 1px 0 rgba(255,244,214,.75);
  font-size:clamp(10px,4.8vw,18px);
  font-size:max(10px,9.2cqi);
  pointer-events:none
}
.card.gilt .n{top:9.7%;left:50%;transform:translateX(-50%)}
.card.gilt .s{bottom:9.3%;left:50%;transform:translateX(-50%)}
.card.gilt .w{left:14.5%;top:50%;transform:translateY(-50%)}
.card.gilt .e{right:14.6%;top:50%;transform:translateY(-50%)}
#lightbox{
  display:none;position:fixed;inset:0;z-index:20;
  background:rgba(16,12,10,.88);
  padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));

#lightbox.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
#lightbox .card.gilt{width:min(72vw,320px);max-width:100%}

#lightbox .nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#lightbox button{

  border-radius:8px;border:1px solid #c6a15a;background:#efe2c4;color:#2a1c12;

const ART_VER = "114";
function artSrc(id){ return "assets/cards/"+id+".webp?v="+ART_VER; }
function cardHTML(c, lazy){
  const load = lazy ? ' loading="lazy" decoding="async"' : ' decoding="async"';
  return `<div class="card gilt" data-card="${c.name}">
    <div class="giltWindow"><img src="${artSrc(c.name)}" alt="${c.display}" width="720" height="1280"${load}></div>
    <span class="n">${c.n}</span><span class="e">${c.e}</span><span class="s">${c.s}</span><span class="w">${c.w}</span>
  </div>`;
}
const main = document.getElementById("main");
const byTier = {};
CARDS.forEach(c => { (byTier[c.tier] ||= []).push(c); });
["Common","Uncommon","Rare","High","Top"].forEach(tier => {
  const list = byTier[tier] || [];
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${tier} <small>${list.length}</small></h2>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  list.forEach(c => {
    const fig = document.createElement("figure");
    fig.innerHTML = cardHTML(c, true) + `<figcaption><b>${c.display}</b>${c.name} · ${tier} · ${c.n}/${c.e}/${c.s}/${c.w} · ${c.budget}</figcaption>`;
    fig.querySelector(".card").addEventListener("click", () => openLb(c.name));
    grid.appendChild(fig);
  });
  sec.appendChild(grid);
  main.appendChild(sec);
});
const lb = document.getElementById("lightbox");
let current = 0;
function openLb(id){
  current = CARDS.findIndex(c => c.name === id);
  showLb();
}
function showLb(){
  const c = CARDS[current];
  const img = document.getElementById("lbArt");
  img.src = artSrc(c.name);
  img.alt = c.display;
  document.getElementById("lbN").textContent = c.n;
  document.getElementById("lbE").textContent = c.e;
  document.getElementById("lbS").textContent = c.s;
  document.getElementById("lbW").textContent = c.w;
  document.getElementById("lbMeta").textContent = c.display+" · "+c.name+" · "+c.tier+" · "+c.n+"/"+c.e+"/"+c.s+"/"+c.w+" · "+c.budget;
  lb.classList.add("on");
}
document.getElementById("close").onclick = () => lb.classList.remove("on");
document.getElementById("prev").onclick = () => { current = (current + CARDS.length - 1) % CARDS.length; showLb(); };
document.getElementById("next").onclick = () => { current = (current + 1) % CARDS.length; showLb(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") lb.classList.remove("on");
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
});
lb.addEventListener("click", e => { if (e.target === lb) lb.classList.remove("on"); });
</script>
