# Publish the playable web core. Do not run a build step.
[build]
  publish = "."

# This is a static PWA. SPA-style fallback is not required.

[build.environment]
  NODE_VERSION = "22"

# Phones keep an installed service worker; do not let the CDN hold an old copy.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
