<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function(){
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  var b = document.createElement("base");
  b.href = "https://raw.githubusercontent.com/M-Sheard/CardRoad/cursor/lythmere-25d-screen-12f4/mockups/lythmere-hex-pieces/";
  document.head.appendChild(b);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lythmere — 3D landmarks on a flat map</title>
<style>
  html,body{margin:0;min-height:100%;background:#17120d;color:#e8dcc4;font:14px/1.4 Georgia,serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh}
  button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;border:0;background:none}

  #visualShell{
    position:relative;
    width:min(390px, 100vw, calc(100dvh * 9 / 16));
    height:min(calc(390px * 16 / 9), 100dvh, calc(100vw * 16 / 9));
    overflow:hidden;border-radius:24px;
    box-shadow:0 16px 48px rgba(0,0,0,.55), 0 0 0 2px #4a3828;
    container-type:size;
    --hud-pad-t: max(16px, env(safe-area-inset-top, 0px) + 10px);
    --hud-pad-r: max(16px, env(safe-area-inset-right, 0px) + 10px);
    --hud-pad-b: max(16px, env(safe-area-inset-bottom, 0px) + 10px);
    --hud-pad-l: max(16px, env(safe-area-inset-left, 0px) + 10px);
    --hud-h: clamp(42px, 7.2cqh, 52px);
    --hud-journal-h: clamp(38px, 6.4cqh, 44px);
    --hud-corner: clamp(14px, 4.1cqw, 24px);
    --hud-seal: clamp(22px, 6cqw, 32px);
  }
  @media (max-width:430px){
    html,body{display:block;overflow:hidden}
    #visualShell{width:100%;height:100dvh;height:100svh;border-radius:0;box-shadow:none}
  }

  .townScene{position:absolute;inset:0;z-index:0;overflow:hidden;background:#3b3122;touch-action:none}
  .scenePlane{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:max(100cqw, calc(100cqh * 9 / 16));
    height:max(100cqh, calc(100cqw * 16 / 9));
  }
  .mapArt{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}

  .piece{
    position:absolute;padding:0;background:none;border:0;
    width:var(--pw);
    left:var(--x); top:var(--y);
    transform:translate(-50%, calc(-1 * var(--anchor)));
    z-index:var(--z);
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-drag:none;
    pointer-events:auto;
  }
  .piece img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .pieces.lit .piece img{filter:drop-shadow(3px 5px 5px rgba(18,12,6,.55))}
  .piece::before{
    content:"";position:absolute;left:2%;right:-4%;bottom:-3%;height:14%;
    border-radius:50%;background:radial-gradient(ellipse at center, rgba(14,9,4,.6), rgba(14,9,4,0) 68%);
    z-index:-1;
  }
  .piece.is-drag{cursor:grabbing;z-index:80!important}
  body.spotListOn .piece.is-sel img{filter:drop-shadow(3px 5px 5px rgba(18,12,6,.55)) brightness(1.08)}
  body.spotListOn .piece.is-sel::after{
    content:"";position:absolute;inset:6% 10% 4%;
    border:2px solid #f2e1be;border-radius:6px;pointer-events:none;
  }
  body.piecesOff .piece{opacity:0;pointer-events:none}

  .mapLabel{
    position:absolute;left:46%;bottom:-11%;transform:translateX(-50%);
    font:400 clamp(11px,3.4cqw,15px)/1 Georgia,"Times New Roman",serif;
    letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
    color:#2c1d08;
    text-shadow:0 0 3px rgba(240,226,188,.95), 0 0 9px rgba(240,226,188,.85), 0 1px 0 rgba(255,246,214,.7);
    pointer-events:none;
  }

  #hudLayer{position:absolute;inset:0;z-index:40;pointer-events:none}
  .worldTopbar{
    position:absolute;left:0;right:0;top:0;z-index:40;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:var(--hud-pad-t) var(--hud-pad-r) 0 var(--hud-pad-l);
    box-sizing:border-box;pointer-events:none;
  }
  .worldActions{flex:0 0 auto;display:flex}
  .scrollPlaque{display:flex;align-items:stretch;padding:0;margin:0;box-sizing:border-box;overflow:visible}
  .scrollWell{flex:1 1 auto;min-width:0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
  .scrollCopy{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;overflow:hidden}
  .paperPlaque{
    position:relative;height:var(--hud-h);min-height:var(--hud-h);
    border:1px solid #c4a06a;border-radius:2px;
    background:linear-gradient(180deg,#f7ead2 0%,#edd6aa 100%);
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));overflow:visible;
  }
  .paperPlaque .scrollWell{background:none;padding:4px 16px}
  .paperCorners{position:absolute;inset:0;z-index:5;pointer-events:none}
  .paperCorner{position:absolute;width:var(--hud-corner);height:calc(var(--hud-corner) * 1.18);object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .paperCorner-tl{top:-4px;left:-4px}
  .paperCorner-tr{top:-4px;right:-4px;transform:scaleX(-1)}
  .paperCorner-bl{bottom:-4px;left:-4px;transform:scaleY(-1)}
  .paperCorner-br{bottom:-4px;right:-4px;transform:scale(-1)}
  .paperSeal{width:var(--hud-seal);height:var(--hud-seal);flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:6}
  #advanceTime.paperPlaque{flex:1 1 auto;min-width:0;max-width:min(264px, calc(100% - 118px))}
  #advanceTime #visualDate{font:700 clamp(11px,3.2cqw,13px)/1.1 Georgia,serif;color:#1a120c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #advanceTime #visualPhase{font:500 clamp(9px,2.7cqw,11px)/1.1 Georgia,serif;color:#614a34;margin-top:1px;letter-spacing:.1em;white-space:nowrap}
  #worldRecord.paperPlaque{height:var(--hud-journal-h);min-height:var(--hud-journal-h);min-width:min(118px,34cqw);font:800 clamp(10px,2.8cqw,11px)/1 Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:#1a120c}
  #worldRecord.paperPlaque .scrollWell{gap:6px;padding:4px 12px 4px 14px}
  #worldRecord .paperCorner{width:calc(var(--hud-corner) * .72);height:calc(var(--hud-corner) * .86)}
  .locationStrip.paperPlaque{position:absolute;z-index:32;left:50%;bottom:var(--hud-pad-b);width:min(620px,calc(100% - 24px));transform:translateX(-50%);pointer-events:auto}
  .locationStrip .paperSeal-left{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:var(--hud-seal);height:var(--hud-seal);object-fit:contain;z-index:6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .locationWell{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;height:100%;padding:4px 12px 4px 28px}
  .locationWell button{position:relative;min-width:0;height:100%;padding:8px 4px;color:#3d2b1a;border-right:1px solid rgba(90,62,38,.22);font:700 clamp(8px,2.4cqw,11px)/1.05 Georgia,serif;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,244,214,.7);pointer-events:auto}
  .locationWell button:last-child{border-right:0}
  .locationWell button.active{color:#1a120c;font-weight:800}
  body.hudOff #hudLayer{display:none}
  body.chromeOff #spotToggle,
  body.chromeOff #spotListToggle,
  body.chromeOff #spotReadout{display:none!important}

  #spotToggle,#spotListToggle,#spotReadout{
    position:absolute;z-index:46;right:max(10px, env(safe-area-inset-right, 0px) + 8px);
    font:650 12px/1.25 system-ui,sans-serif;color:#241a13;
    background:rgba(242,225,190,.96);border:2px solid #594333;border-radius:5px;
    box-shadow:0 4px 12px #0007;cursor:pointer;pointer-events:auto;
  }
  #spotToggle{
    top:max(64px, calc(env(safe-area-inset-top, 0px) + 56px));
    min-width:108px;padding:7px 10px;
  }
  #spotListToggle{
    top:max(100px, calc(env(safe-area-inset-top, 0px) + 92px));
    min-width:108px;padding:5px 8px;font-size:11px;
  }
  #spotReadout{
    display:none;top:max(136px, calc(env(safe-area-inset-top, 0px) + 128px));
    left:auto;width:min(228px, calc(100% - 24px));bottom:auto;
    padding:6px 7px 7px;border-radius:6px;cursor:default;
    font:650 10px/1.3 system-ui,sans-serif;
  }
  body.spotListOn #spotReadout{display:block}
  #spotReadout b{display:block;margin-bottom:2px;font:800 11px Georgia,serif}
  #spotReadout .spotHint{margin:0 0 4px;color:#614a34;font-size:9px}
  #spotReadout code{font:700 10px/1.35 ui-monospace,Consolas,monospace}
  #spotReadout .spotEnd{display:flex;justify-content:space-between;align-items:center;gap:4px;margin:3px 0}
  #spotReadout .spotActs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  #spotReadout button{
    padding:3px 6px;font-size:10px;font-weight:700;background:#e9ddc3;color:#241a13;
    border:1px solid #9f8e72;border-radius:4px;cursor:pointer;
  }
  #spotReadout button.on{background:#241a13;color:#f2e1be}
</style>
</head>
<body class="spotListOn">

<section id="visualShell">
  <div class="townScene">
    <div class="scenePlane" id="scenePlane">
      <img class="mapArt" id="mapArt" src="./map-plain.jpg" alt="The Lythmere map">
      <div class="pieces lit" id="pieces"></div>
    </div>
  </div>

  <div id="hudLayer" class="townHud">
    <div class="worldTopbar">
      <button type="button" id="advanceTime" class="scrollPlaque paperPlaque" aria-label="Pass time">
        <span class="paperCorners" aria-hidden="true">
          <img class="paperCorner paperCorner-tl" src="../isometric-town/hud/paper_corner.png" alt="">
          <img class="paperCorner paperCorner-tr" src="../isometric-town/hud/paper_corner.png" alt="">
          <img class="paperCorner paperCorner-bl" src="../isometric-town/hud/paper_corner.png" alt="">
          <img class="paperCorner paperCorner-br" src="../isometric-town/hud/paper_corner.png" alt="">
        </span>
        <span class="scrollWell"><span class="scrollCopy"><b id="visualDate">Mon 2 Mar</b><span id="visualPhase">MORNING · YEAR 1</span></span></span>
      </button>
      <div class="worldActions">
        <button id="worldRecord" class="scrollPlaque paperPlaque" type="button" aria-label="Open journal">
          <span class="paperCorners" aria-hidden="true">
            <img class="paperCorner paperCorner-tl" src="../isometric-town/hud/paper_corner.png" alt="">
            <img class="paperCorner paperCorner-tr" src="../isometric-town/hud/paper_corner.png" alt="">
            <img class="paperCorner paperCorner-bl" src="../isometric-town/hud/paper_corner.png" alt="">
            <img class="paperCorner paperCorner-br" src="../isometric-town/hud/paper_corner.png" alt="">
          </span>
          <span class="scrollWell"><span>Journal</span><img class="paperSeal" src="../isometric-town/hud/paper_seal.png" alt=""></span>
        </button>
      </div>
    </div>

    <nav class="locationStrip scrollPlaque paperPlaque" aria-label="Lythmere locations">
      <span class="paperCorners" aria-hidden="true">
        <img class="paperCorner paperCorner-tl" src="../isometric-town/hud/paper_corner.png" alt="">
        <img class="paperCorner paperCorner-tr" src="../isometric-town/hud/paper_corner.png" alt="">
        <img class="paperCorner paperCorner-bl" src="../isometric-town/hud/paper_corner.png" alt="">
        <img class="paperCorner paperCorner-br" src="../isometric-town/hud/paper_corner.png" alt="">
      </span>
      <img class="paperSeal paperSeal-left" src="../isometric-town/hud/paper_seal.png" alt="">
      <div class="scrollWell locationWell" id="locationWell">
        <button type="button" data-loc="Market">Market</button>
        <button type="button" data-loc="Riverside">Riverside</button>
        <button type="button" data-loc="Inn">Inn</button>
        <button type="button" data-loc="Club">Club</button>
      </div>
    </nav>
  </div>

  <button type="button" id="spotToggle">Hide HUD</button>
  <button type="button" id="spotListToggle">Hide list</button>
  <div id="spotReadout"></div>
</section>

<script>
(function(){
  /* x / y = where the model's base centre lands, as % of the map.
     w = width of the piece. anchor = how far down its own image that
     base centre sits, so a tall model rises off the map. */
  const DEFAULTS = [
    { loc:"Inn",       x:19.0, y:42.5, w:36.0, anchor:72 },
    { loc:"Club",      x:80.1, y:33.7, w:34.0, anchor:67 },
    { loc:"Market",    x:85.1, y:56.6, w:34.0, anchor:70 },
    { loc:"Riverside", x:29.7, y:77.6, w:36.0, anchor:62 }
  ];
  const KEY = "cardRoadLandmarkPieces";
  const host = document.getElementById("pieces");
  const plane = document.getElementById("scenePlane");
  const mapArt = document.getElementById("mapArt");
  const readout = document.getElementById("spotReadout");
  const locBtns = [...document.querySelectorAll("#locationWell [data-loc]")];
  let pieces = clone(DEFAULTS);
  let selected = "Inn";
  let drag = null;
  let gridOn = false;
  let listOn = true;

  function clone(list){
    return list.map(p => ({loc:p.loc, x:+p.x, y:+p.y, w:+p.w, anchor:+p.anchor}));
  }
  function find(loc){ return pieces.find(p => p.loc === loc); }
  function elFor(loc){ return host.querySelector('.piece[data-loc="'+loc+'"]'); }

  function load(){
    try{
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (raw && Array.isArray(raw.pieces) && raw.pieces.length === 4){
        pieces = clone(raw.pieces);
      }
      if (raw && raw.gridOn) gridOn = true;
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({pieces, gridOn})); }catch(e){}
  }

  function apply(el, p){
    el.style.setProperty("--x", p.x.toFixed(1) + "%");
    el.style.setProperty("--y", p.y.toFixed(1) + "%");
    el.style.setProperty("--pw", p.w.toFixed(1) + "%");
    el.style.setProperty("--anchor", p.anchor + "%");
    el.style.setProperty("--z", String(10 + Math.round(p.y)));
  }

  function draw(){
    host.textContent = "";
    const order = pieces.slice().sort((a,b) => a.y - b.y);
    for (const p of order){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "piece" + (p.loc === selected ? " is-sel" : "");
      b.dataset.loc = p.loc;
      b.setAttribute("aria-label", "Place the " + p.loc);
      apply(b, p);
      const img = document.createElement("img");
      img.src = "./piece-" + p.loc.toLowerCase() + ".png";
      img.alt = "";
      img.draggable = false;
      const tag = document.createElement("span");
      tag.className = "mapLabel";
      tag.textContent = p.loc;
      b.append(img, tag);
      b.addEventListener("pointerdown", onDown);
      host.append(b);
    }
    locBtns.forEach(btn => btn.classList.toggle("active", btn.dataset.loc === selected));
    mapArt.src = gridOn ? "./map-bare-grid.jpg" : "./map-plain.jpg";
    paint();
  }

  function paint(){
    readout.innerHTML =
      "<b>Place landmarks</b>" +
      "<p class=\"spotHint\">Same as placing people: drag a piece, +/− size, Copy. Hex grid is off.</p>" +
      pieces.map(p => {
        const on = p.loc === selected ? " style=\"color:#7a1c18\"" : "";
        return `<div class="spotEnd" data-pick="${p.loc}"${on}><span>${p.loc}</span><code>${p.x.toFixed(0)} ${p.y.toFixed(0)} ${p.w.toFixed(1)}</code></div>`;
      }).join("") +
      `<div class="spotActs">
        <button type="button" data-dir="-1">−</button>
        <button type="button" data-dir="1">+</button>
        <button type="button" id="spotCopy">Copy</button>
        <button type="button" id="spotReset">Reset</button>
        <button type="button" id="spotGrid" class="${gridOn?"on":""}">Hex</button>
      </div>`;
  }

  function cssText(){
    return "/* Lythmere landmarks — x y = base centre %, w = width % */\n" +
      pieces.map(p =>
        `{ loc:"${p.loc}", x:${p.x.toFixed(1)}, y:${p.y.toFixed(1)}, w:${p.w.toFixed(1)}, anchor:${p.anchor} }`
      ).join(",\n");
  }

  function pct(clientX, clientY){
    const r = plane.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / r.width) * 100,
      y: ((clientY - r.top) / r.height) * 100
    };
  }

  function select(loc){
    selected = loc;
    host.querySelectorAll(".piece").forEach(el => el.classList.toggle("is-sel", el.dataset.loc === loc));
    locBtns.forEach(btn => btn.classList.toggle("active", btn.dataset.loc === loc));
    paint();
  }

  function bump(dir){
    const p = find(selected);
    if (!p) return;
    p.w = Math.max(18, Math.min(56, p.w + dir * 1.5));
    apply(elFor(p.loc), p);
    save(); paint();
  }

  function onDown(e){
    const el = e.currentTarget;
    const p = find(el.dataset.loc);
    if (!p) return;
    e.preventDefault();
    select(p.loc);
    const pos = pct(e.clientX, e.clientY);
    drag = { loc:p.loc, id:e.pointerId, grabX:p.x - pos.x, grabY:p.y - pos.y };
    el.classList.add("is-drag");
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  }

  window.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = find(drag.loc);
    const el = elFor(drag.loc);
    if (!p || !el) return;
    const pos = pct(e.clientX, e.clientY);
    p.x = Math.max(8, Math.min(92, pos.x + drag.grabX));
    p.y = Math.max(10, Math.min(90, pos.y + drag.grabY));
    apply(el, p);
  });
  window.addEventListener("pointerup", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const el = elFor(drag.loc);
    if (el) el.classList.remove("is-drag");
    drag = null;
    save(); paint();
  });
  window.addEventListener("pointercancel", () => { drag = null; });

  plane.addEventListener("wheel", e => {
    const el = e.target.closest(".piece");
    if (!el) return;
    e.preventDefault();
    select(el.dataset.loc);
    bump(e.deltaY < 0 ? 1 : -1);
  }, {passive:false});

  readout.addEventListener("click", e => {
    const pick = e.target.closest("[data-pick]");
    if (pick){ select(pick.dataset.pick); return; }
    const dir = e.target.closest("[data-dir]");
    if (dir){ bump(+dir.dataset.dir); return; }
    if (e.target.id === "spotReset"){
      pieces = clone(DEFAULTS);
      gridOn = false;
      save(); draw();
      return;
    }
    if (e.target.id === "spotGrid"){
      gridOn = !gridOn;
      save(); draw();
      return;
    }
    if (e.target.id === "spotCopy"){
      const text = cssText();
      navigator.clipboard.writeText(text).then(() => {
        e.target.textContent = "Copied";
        setTimeout(() => e.target.textContent = "Copy", 1200);
      }).catch(() => window.prompt("Copy CSS", text));
    }
  });

  locBtns.forEach(btn => btn.addEventListener("click", () => select(btn.dataset.loc)));

  document.getElementById("spotListToggle").addEventListener("click", () => {
    listOn = !listOn;
    document.body.classList.toggle("spotListOn", listOn);
    document.getElementById("spotListToggle").textContent = listOn ? "Hide list" : "Show list";
  });
  document.getElementById("spotToggle").addEventListener("click", () => {
    const off = document.body.classList.toggle("hudOff");
    document.getElementById("spotToggle").textContent = off ? "Show HUD" : "Hide HUD";
  });

  const asked = new URLSearchParams(location.search);
  load();
  if (asked.get("hud") === "0" || asked.get("hud") === "off"){
    document.body.classList.add("hudOff");
    document.getElementById("spotToggle").textContent = "Show HUD";
  }
  if (asked.get("list") === "0"){
    listOn = false;
    document.body.classList.remove("spotListOn");
    document.getElementById("spotListToggle").textContent = "Show list";
  }
  if (asked.get("pieces") === "0") document.body.classList.add("piecesOff");
  if (asked.get("grid") === "1") gridOn = true;
  if (asked.get("chrome") === "0") document.body.classList.add("chromeOff");
  draw();
})();
</script>
</body>
</html>
