<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Card Road — place options</title>
<style>
:root{
  --paper:#f1e4c8;
  --ink:#241a13;
  --oak:#6a4a32;
  --oak-dark:#3a271b;
  --well:#c4a57a;
  --player:#3979c5;
  --npc:#b44b4b;
  --gold:#c9a15a;
}
*{box-sizing:border-box}
html,body{margin:0;background:#1c1713;color:var(--ink);font:16px/1.35 Georgia,serif}
body{
  min-height:100dvh;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.wrap{max-width:430px;margin:0 auto}
h1{margin:0 0 6px;font:700 22px/1.15 Georgia,serif;color:#f4ead3}
.lede{margin:0 0 12px;color:#d8c4a4;font:15px/1.4 system-ui,sans-serif}
.lock{
  width:100%;margin:0 0 8px;min-height:52px;padding:8px 10px;
  border:2px solid #7a542c;border-radius:5px;background:#e8c27a;color:#241a13;
  font:700 15px/1.2 Georgia,serif;cursor:pointer;
}
.opts{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:8px;
}
.opts button{
  min-height:52px;padding:6px 4px;border:2px solid #594333;border-radius:5px;
  background:rgba(242,225,190,.96);color:#241a13;
  font:700 11px/1.2 system-ui,sans-serif;cursor:pointer;
}
.opts button[aria-pressed="true"]{background:#e8c27a;box-shadow:inset 0 0 0 2px #7a542c}
.blurb{min-height:3.2em;margin:0 0 12px;color:#f0e2c8;font:14px/1.4 system-ui,sans-serif}
.table{
  background:linear-gradient(#7a5538,#5a3c28);
  border:8px solid #3a271b;border-radius:10px;
  padding:10px 10px 12px;box-shadow:0 16px 40px #000a,inset 0 0 0 2px #c4a57a55;
}
.who{font:700 12px system-ui,sans-serif;color:#f7efdc;margin:0 0 6px;letter-spacing:.04em}
.board{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  width:min(100%,calc((100dvh - 11rem) / 2.05));
  margin:0 auto;
  background:#473428;padding:8px;border:4px solid #291e17;border-radius:6px;
}
.cell{
  aspect-ratio:5/7;position:relative;overflow:visible;
  background:
    linear-gradient(#0000,#0003),
    repeating-linear-gradient(90deg,#c4a57a 0 12px,#bb9b72 12px 13px);
  border:2px solid #5a4030;border-radius:8px;
  box-shadow:inset 0 2px 6px #0005;
  perspective:420px;
}
.cell.legal{outline:2px dashed #e8c27a88;outline-offset:-3px}
.hand{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px;min-height:0;
  width:min(100%,calc((100dvh - 11rem) / 2.05));
  margin-left:auto;margin-right:auto;
}
.hand .card{min-height:0;height:100%;aspect-ratio:5/7}
.card{
  position:relative;height:100%;min-height:0;aspect-ratio:5/7;
  background:var(--paper);color:#111;border:3px solid #594333;border-radius:8px;
  box-shadow:0 3px 7px #0005;
}
.card.p{border-color:var(--player)}
.card.ai{border-color:var(--npc)}
.card.sel{outline:2px solid #d5ac61;outline-offset:1px}
.nm{position:absolute;top:3px;left:3px;right:3px;font:800 9px/1 system-ui,sans-serif;text-align:center}
.n,.e,.s,.w{position:absolute;font:900 15px/1 Georgia,serif}
.n{top:18px;left:50%;transform:translateX(-50%)}
.s{bottom:4px;left:50%;transform:translateX(-50%)}
.w{left:6px;top:50%;transform:translateY(-50%)}
.e{right:6px;top:50%;transform:translateY(-50%)}
.replay{
  width:100%;margin-top:12px;min-height:48px;
  background:#efe0be;color:#201812;border:2px solid #654d39;border-radius:6px;
  font:700 15px Georgia,serif;cursor:pointer;
}
.ghost{
  position:fixed;z-index:20;pointer-events:none;margin:0;
}
.cell .ring{
  position:absolute;inset:4px;border:2px solid transparent;border-radius:6px;pointer-events:none;
}
.cell.stamp-flash .ring{border-color:var(--gold);box-shadow:0 0 10px #e8c27a88}
@keyframes slap{
  0%{transform:translateY(-12px) scale(.86);box-shadow:0 18px 22px #0007;opacity:.92}
  58%{transform:translateY(3px) scale(1.05);box-shadow:0 2px 4px #0006}
  100%{transform:translateY(0) scale(1);box-shadow:0 3px 7px #0005;opacity:1}
}
@keyframes stamp{
  0%{transform:scale(1)}
  35%{transform:scale(.93)}
  100%{transform:scale(1)}
}
@keyframes flipIn{
  0%{transform:rotateY(-90deg);opacity:.4}
  100%{transform:rotateY(0);opacity:1}
}
@keyframes quietIn{
  0%{opacity:0}
  100%{opacity:1}
}
@keyframes captureFlash{
  0%{filter:brightness(1);transform:translate(0,0)}
  35%{filter:brightness(1.18);transform:translate(var(--dx,0),var(--dy,0))}
  100%{filter:brightness(1);transform:translate(0,0)}
}
.play-slap{animation:slap .2s cubic-bezier(.2,1.4,.3,1) both}
.play-stamp{animation:stamp .22s ease-in-out both}
.play-flip{transform-origin:center;animation:flipIn .28s ease-out both}
.play-quiet{animation:quietIn .08s linear both}
.play-capture{animation:captureFlash .28s ease-out both}
@media(prefers-reduced-motion:reduce){
  .play-slap,.play-stamp,.play-flip,.play-quiet,.play-capture{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Place options</h1>
  <p class="lede">Locked: the card flies from the hand, then captured neighbours flip. Compare the others if you want.</p>
  <button type="button" class="lock" id="lockedPlay" data-opt="combo">Play fly + capture</button>
  <div class="opts" role="tablist">
    <button type="button" data-opt="slap" aria-pressed="false">1 Slap</button>
    <button type="button" data-opt="fly" aria-pressed="false">2 Fly</button>
    <button type="button" data-opt="flip" aria-pressed="false">3 Flip</button>
    <button type="button" data-opt="stamp" aria-pressed="false">4 Stamp</button>
    <button type="button" data-opt="capture" aria-pressed="false">5 Capture</button>
  </div>
  <p class="blurb" id="blurb">Pick a place-feel.</p>
  <div class="table">
    <p class="who">TOMAS</p>
    <div class="board" id="board"></div>
    <p class="who" style="margin-top:10px">YOUR HAND</p>
    <div class="hand" id="hand"></div>
  </div>
  <button type="button" class="replay" id="replay">Play again</button>
</div>
<script>
const BLURB={
  combo:"Locked pair: C076 flies from the hand into the well, then Tomas's neighbours flip to you.",
  slap:"Card drops into the well with a short overshoot, like paper hitting oak. ~200ms.",
  fly:"The chosen hand card travels into the square, then the hand closes the gap. ~280ms.",
  flip:"The card turns onto the well from edge-on, as if dealt face-up. ~280ms.",
  stamp:"The card is already on the square, then presses in with a wax-gold rim. ~220ms.",
  capture:"The new card appears still. Neighbours flip owner colour with a tiny nudge. Quiet place, loud fight."
};
const TARGET=4;
let current="combo";
let playing=false;

function cardEl(name,n,e,s,w,owner,sel){
  const d=document.createElement("div");
  d.className="card "+owner+(sel?" sel":"");
  d.innerHTML=`<div class="nm">${name}</div><span class="n">${n}</span><span class="e">${e}</span><span class="s">${s}</span><span class="w">${w}</span>`;
  return d;
}

function occupier(i,placed){
  if(i===0) return cardEl("C054",8,3,7,2,"ai");
  if(i===3) return cardEl("C078",8,3,8,3,"ai");
  if(i===5) return cardEl("C052",5,5,4,6,"p");
  if(i===8) return cardEl("C060",4,6,6,4,"p");
  if(i===TARGET && placed) return cardEl("C076",6,6,5,5,"p");
  return null;
}

function resetBoard(placed){
  const board=$("board");
  board.innerHTML="";
  for(let i=0;i<9;i++){
    const cell=document.createElement("div");
    cell.className="cell"+(i===TARGET && !placed?" legal":"");
    cell.dataset.i=i;
    const ring=document.createElement("div");
    ring.className="ring";
    cell.appendChild(ring);
    const c=occupier(i,placed);
    if(c) cell.appendChild(c);
    board.appendChild(cell);
  }
  const hand=$("hand");
  hand.innerHTML="";
  const names=[["C022",5,4,3,5],["C076",6,6,5,5],["C041",6,5,4,4],["C031",4,6,4,4],["C014",5,4,4,3]];
  names.forEach((x,idx)=>{
    if(placed && x[0]==="C076") return;
    const c=cardEl(x[0],x[1],x[2],x[3],x[4],"p",!placed && x[0]==="C076");
    c.dataset.hand=x[0];
    hand.appendChild(c);
  });
  if(placed){
    const gap=document.createElement("div");
    gap.style.aspectRatio="5/7";
    hand.appendChild(gap);
  }
}

function $(id){return document.getElementById(id)}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}

async function play(opt){
  if(playing) return;
  playing=true;
  current=opt;
  document.querySelectorAll(".opts button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.opt===opt?"true":"false"));
  $("blurb").textContent=BLURB[opt];
  document.querySelectorAll(".ghost").forEach(g=>g.remove());
  resetBoard(false);
  const cell=$("board").children[TARGET];
  const handCard=[...$("hand").children].find(n=>n.dataset.hand==="C076");

  if((opt==="fly"||opt==="combo") && handCard){
    const from=handCard.getBoundingClientRect();
    const to=cell.getBoundingClientRect();
    const ghost=cardEl("C076",6,6,5,5,"p",true);
    ghost.classList.add("ghost");
    ghost.style.width=from.width+"px";
    ghost.style.height=from.height+"px";
    ghost.style.left=from.left+"px";
    ghost.style.top=from.top+"px";
    ghost.style.transition="left .28s cubic-bezier(.2,.7,.2,1), top .28s cubic-bezier(.2,.7,.2,1), width .28s ease, height .28s ease, transform .28s ease";
    document.body.appendChild(ghost);
    handCard.style.visibility="hidden";
    await wait(20);
    ghost.style.left=to.left+"px";
    ghost.style.top=to.top+"px";
    ghost.style.width=to.width+"px";
    ghost.style.height=to.height+"px";
    await wait(290);
    ghost.remove();
    resetBoard(true);
    if(opt==="combo"){
      const n=$("board").children[0].querySelector(".card");
      const w=$("board").children[3].querySelector(".card");
      if(n){
        n.style.setProperty("--dx","0px");
        n.style.setProperty("--dy","7px");
        n.classList.remove("ai"); n.classList.add("p","play-capture");
      }
      await wait(80);
      if(w){
        w.style.setProperty("--dx","7px");
        w.style.setProperty("--dy","0px");
        w.classList.remove("ai"); w.classList.add("p","play-capture");
      }
      await wait(300);
    }
    playing=false;
    return;
  }

  resetBoard(true);
  const placed=cell.querySelector(".card") || $("board").children[TARGET].querySelector(".card");
  const live=$("board").children[TARGET];
  const card=live.querySelector(".card");
  live.classList.remove("legal");

  if(opt==="slap"){
    card.classList.add("play-slap");
    await wait(220);
  }else if(opt==="flip"){
    card.classList.add("play-flip");
    await wait(300);
  }else if(opt==="stamp"){
    card.classList.add("play-stamp");
    live.classList.add("stamp-flash");
    await wait(240);
    live.classList.remove("stamp-flash");
  }else if(opt==="capture"){
    card.classList.add("play-quiet");
    await wait(90);
    const n=$("board").children[0].querySelector(".card");
    const w=$("board").children[3].querySelector(".card");
    if(n){
      n.style.setProperty("--dx","0px");
      n.style.setProperty("--dy","6px");
      n.classList.remove("ai"); n.classList.add("p","play-capture");
    }
    await wait(80);
    if(w){
      w.style.setProperty("--dx","6px");
      w.style.setProperty("--dy","0px");
      w.classList.remove("ai"); w.classList.add("p","play-capture");
    }
    await wait(300);
  }
  playing=false;
}

document.querySelector(".opts").addEventListener("click",e=>{
  const b=e.target.closest("button[data-opt]");
  if(b) play(b.dataset.opt);
});
$("lockedPlay").onclick=()=>play("combo");
$("replay").onclick=()=>play(current);
resetBoard(false);
play("combo");
</script>
</body>
</html>
