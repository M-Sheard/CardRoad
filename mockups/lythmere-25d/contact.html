<title>Lythmere 2.5D — contact sheet</title>
<style>

<h1>Lythmere — 2.5D town screen, eight finishes</h1>
<p class="note">All eight share one layout brief: true isometric, one sun from the upper left, Inn / Market / Club / Riverside in four separate zones, calm bands top and bottom for the HUD. Shown in a 390&times;844 phone frame with the live paper chrome over them.</p>
<div class="sheet">
  <figure class="pick"><img src="./shots/g-safe-diorama.jpg" alt=""><figcaption><b>G · diorama</b><br>lead pick</figcaption></figure>

  <figure><img src="./shots/e-tight-crop.jpg" alt=""><figcaption><b>E · close diorama</b><br>clips on tall phones</figcaption></figure>

  <figure><img src="./shots/f-golden-hour.jpg" alt=""><figcaption><b>F · golden hour</b></figcaption></figure>
  <figure><img src="./shots/c-gouache.jpg" alt=""><figcaption><b>C · gouache</b><br>reads flat</figcaption></figure>
